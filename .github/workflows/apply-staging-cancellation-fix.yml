name: Apply Staging Cancellation Fix

on:
  push:
    branches:
      - "staging/booking-crm-integration"

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/booking-crm-integration
      - name: Apply isolated cancellation field fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/booking-modals.tsx')
          text = path.read_text(encoding='utf-8')
          old = '        cancelReason: reason,\n'
          new = '        cancellationReason: reason,\n'
          if old not in text:
              print('Target line already fixed; no source change needed.')
          else:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('Applied isolated cancellationReason field fix.')
          PY
      - name: Commit source fix if changed
        shell: bash
        run: |
          if git diff --quiet -- src/components/booking-modals.tsx; then
            echo "No source change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/booking-modals.tsx
          git commit -m "fix: preserve cancellation reason in CRM request"
          git push origin HEAD:staging/booking-crm-integration
