name: Staging Booking Fix Verification

on:
  push:
    branches:
      - "staging/booking-crm-integration"

permissions:
  contents: read

jobs:
  booking-fix-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run booking fix regression tests
        run: npx vitest run src/lib/bookings.functions.test.ts integrations/google-apps-script/booking-backend-v5-patch.test.ts
