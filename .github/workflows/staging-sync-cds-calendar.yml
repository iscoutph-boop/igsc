name: Staging Sync CDS Calendar

on:
  push:
    branches:
      - feature/booking-email-staging-recovered-2

permissions:
  contents: write

jobs:
  sync:
    if: "${{ github.event.head_commit.message != 'chore(staging): sync CDS calendar identity' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/booking-email-staging-recovered-2
          fetch-depth: 0
      - name: Synchronize CDS-owned calendar ID
        shell: bash
        run: |
          set -euo pipefail
          OLD='cbaff5b7abd586ce7e993fbd1809c7f99eda329da29d053af41192291f6f0bb2@group.calendar.google.com'
          NEW='9a8c649815522b6ac9366068aa0a8e3b930046d1d5e6483a0db709f509156ca5@group.calendar.google.com'
          FILES=(
            'apps-script/IGS_Staging_CRM_V6_2_5_PRODUCTION_READINESS_R2.gs'
            'apps-script/IGS_Staging_CRM_V6_2_5.calendar-identity.test.ts'
          )
          for file in "${FILES[@]}"; do
            grep -qF "$OLD" "$file" || { echo "Expected old calendar ID not found in $file"; exit 1; }
            sed -i "s|$OLD|$NEW|g" "$file"
          done
          git diff --check
          git diff --exit-code --quiet && { echo 'No changes required'; exit 0; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${FILES[@]}"
          git commit -m 'chore(staging): sync CDS calendar identity'
          git push origin HEAD:feature/booking-email-staging-recovered-2
