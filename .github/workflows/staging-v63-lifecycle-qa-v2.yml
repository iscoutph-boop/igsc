name: Staging V6.3 Lifecycle QA v2

on:
  push:
    branches:
      - feature/booking-email-staging-recovered-2
    paths:
      - .github/workflows/staging-v63-lifecycle-qa-v2.yml

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run live staging lifecycle
        env:
          QA_URL: https://deploy-preview-4--darling-sunburst-da0a5d.netlify.app/consultation
        run: |
          cat > .tmp-v63-qa.mjs <<'EOF'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs';

          const url = process.env.QA_URL;
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1100 } });
          const consoleProblems = [];
          page.on('console', msg => {
            if (msg.type() === 'error' || msg.type() === 'warning') consoleProblems.push(`${msg.type()}: ${msg.text()}`);
          });
          page.on('pageerror', err => consoleProblems.push(`pageerror: ${err.message}`));

          const stamp = Date.now();
          const qa = {
            fullName: `V63 QA ${stamp}`,
            phone: '09171234567',
            email: `caballerodigitals+v63qa${stamp}@gmail.com`,
            location: 'Cagayan de Oro',
            area: '150 sqm',
            details: `V6.3 staging lifecycle QA ${stamp}`,
          };

          function ymdPlus(days) {
            const d = new Date();
            d.setUTCDate(d.getUTCDate() + days);
            return d.toISOString().slice(0, 10);
          }
          const initialDate = ymdPlus(2);
          const rescheduledDate = ymdPlus(3);

          async function chooseDate(ymd) {
            await page.getByText('Pick a date', { exact: true }).click();
            const exact = page.locator(`button[data-day="${ymd}"]`);
            if (await exact.count()) {
              await exact.first().click();
              return;
            }
            const day = Number(ymd.slice(-2));
            const candidates = page.locator('button').filter({ hasText: new RegExp(`^${day}$`) });
            for (let i = 0; i < await candidates.count(); i++) {
              const c = candidates.nth(i);
              if (await c.isVisible() && await c.isEnabled()) { await c.click(); return; }
            }
            throw new Error(`Unable to choose date ${ymd}`);
          }

          async function chooseTime(label) {
            await page.getByText('Pick a time', { exact: true }).click();
            await page.getByRole('option', { name: label, exact: true }).click();
          }

          async function fillForm() {
            await page.getByLabel('Full name').fill(qa.fullName);
            await page.getByLabel('Mobile number').fill(qa.phone);
            await page.getByLabel('Email address').fill(qa.email);
            await page.getByLabel('Project type').selectOption({ label: 'Residential' });
            await page.getByLabel('Preferred service').selectOption({ label: 'Project Consultation' });
            await page.getByLabel('Project location').fill(qa.location);
            await page.getByLabel('Approximate lot or floor area').fill(qa.area);
            await page.getByLabel('Budget range').selectOption({ label: 'PHP 3,000,000 - PHP 5,000,000' });
            await page.getByLabel(/Project description/).fill(qa.details);
            await chooseDate(initialDate);
            await chooseTime('9:00 AM');
            await page.getByRole('checkbox').check();
            await page.waitForTimeout(1700);
          }

          async function openManage(ref, email) {
            const success = page.locator('#consultation-confirmation');
            await success.getByRole('button', { name: /manage booking/i }).click();
            const refInput = page.getByPlaceholder(/Example: IGS-/i);
            if ((await refInput.inputValue()).toUpperCase() !== ref) throw new Error('Manage booking reference was not prefilled');
            await page.getByPlaceholder(/Enter your email or phone number/i).fill(email);
            await page.getByRole('button', { name: /find my booking/i }).click();
            await page.getByRole('heading', { name: /Appointment request found/i }).waitFor({ timeout: 30000 });
          }

          try {
            await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
            if (!/Book a Consultation/i.test(await page.title())) throw new Error(`Unexpected title: ${await page.title()}`);
            if (!await page.getByRole('heading', { name: /Let’s build something great together/i }).isVisible()) throw new Error('Consultation page did not render');
            await fillForm();
            await page.getByRole('button', { name: /submit consultation request/i }).click();
            await page.getByRole('heading', { name: /Consultation request received/i }).waitFor({ timeout: 45000 });
            const successText = await page.locator('#consultation-confirmation').innerText();
            const refMatch = successText.match(/IGS-\d{4}-(?:[0-9A-F]{32}|\d{4})/i);
            if (!refMatch) throw new Error(`Booking reference not found in success state: ${successText}`);
            const ref = refMatch[0].toUpperCase();
            await page.screenshot({ path: '/tmp/01-created.png', fullPage: false });

            await openManage(ref, qa.email);
            if (!(await page.locator('body').innerText()).includes(ref)) throw new Error('Find result missing booking reference');

            await page.getByRole('button', { name: /reschedule booking/i }).click();
            await chooseDate(rescheduledDate);
            await chooseTime('10:30 AM');
            await page.getByLabel(/Reason \/ notes/i).fill('Automated V6.3 staging reschedule QA');
            await page.getByRole('button', { name: /confirm new schedule/i }).click();
            await page.getByRole('heading', { name: /Booking rescheduled/i }).waitFor({ timeout: 30000 });
            await page.screenshot({ path: '/tmp/02-rescheduled.png', fullPage: false });

            await page.getByRole('button', { name: /^close$/i }).click();
            await openManage(ref, qa.email);
            if (!/Rescheduled/i.test(await page.locator('body').innerText())) throw new Error('Find after reschedule did not show Rescheduled status');

            await page.getByRole('button', { name: /cancel booking/i }).click();
            await page.getByLabel(/Cancellation reason/i).fill('Automated V6.3 staging cancellation QA');
            await page.getByRole('button', { name: /yes, cancel booking/i }).click();
            await page.getByRole('heading', { name: /Booking cancelled/i }).waitFor({ timeout: 30000 });
            await page.screenshot({ path: '/tmp/03-cancelled.png', fullPage: false });

            await page.getByRole('button', { name: /^close$/i }).click();
            await openManage(ref, qa.email);
            if (!/Cancelled/i.test(await page.locator('body').innerText())) throw new Error('Find after cancel did not show Cancelled status');
            await page.getByLabel('Close manage booking').click();

            await page.reload({ waitUntil: 'networkidle' });
            await fillForm();
            await page.getByRole('button', { name: /submit consultation request/i }).click();
            const alert = page.getByRole('alert');
            await alert.waitFor({ timeout: 30000 });
            const duplicateMessage = await alert.innerText();
            if (!/matching request|received recently|wait before trying again/i.test(duplicateMessage)) {
              throw new Error(`Duplicate suppression did not trigger: ${duplicateMessage}`);
            }
            await page.screenshot({ path: '/tmp/04-duplicate-blocked.png', fullPage: false });

            const report = { ref, qa, initialDate, rescheduledDate, duplicateMessage, consoleProblems };
            fs.writeFileSync('/tmp/v63-qa.json', JSON.stringify(report, null, 2));
            console.log(`QA_RESULT=${JSON.stringify(report)}`);
          } catch (error) {
            await page.screenshot({ path: '/tmp/99-failure.png', fullPage: true }).catch(() => {});
            fs.writeFileSync('/tmp/v63-qa-failure.txt', String(error?.stack || error));
            throw error;
          } finally {
            await browser.close();
            fs.rmSync('.tmp-v63-qa.mjs', { force: true });
          }
          EOF
          node .tmp-v63-qa.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v63-staging-lifecycle-qa-v2
          path: |
            /tmp/v63-qa.json
            /tmp/v63-qa-failure.txt
            /tmp/01-created.png
            /tmp/02-rescheduled.png
            /tmp/03-cancelled.png
            /tmp/04-duplicate-blocked.png
            /tmp/99-failure.png
          if-no-files-found: warn
