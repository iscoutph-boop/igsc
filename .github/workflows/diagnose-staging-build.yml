name: Diagnose staging build

on:
  push:
    branches:
      - feature/booking-email-staging-recovered-2
    paths:
      - .github/workflows/diagnose-staging-build.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/booking-email-staging-recovered-2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: build
        name: Run production build
        continue-on-error: true
        run: npm run build
      - name: Remove one-shot workflow
        if: always()
        run: rm -f .github/workflows/diagnose-staging-build.yml
      - name: Commit cleanup
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore(staging): remove build diagnostic workflow"
          git push origin HEAD:feature/booking-email-staging-recovered-2
      - name: Propagate build result
        if: steps.build.outcome != 'success'
        run: exit 1
