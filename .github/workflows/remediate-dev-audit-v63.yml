name: Remediate V6.3 Dev Dependency Audit

on:
  push:
    branches:
      - feature/booking-email-staging-recovered-2
    paths:
      - .github/workflows/remediate-dev-audit-v63.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/booking-email-staging-recovered-2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply non-force lockfile remediation
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund
      - name: Clean install remediated tree
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Require full dependency audit clean
        run: npm audit --audit-level=moderate
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit safe lockfile remediation
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile update required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: remediate development dependency advisories"
          git pull --rebase origin feature/booking-email-staging-recovered-2
          git push origin HEAD:feature/booking-email-staging-recovered-2
