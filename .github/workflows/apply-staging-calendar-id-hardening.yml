name: Apply staging Calendar ID hardening

on:
  push:
    branches:
      - feature/booking-email-staging-recovered-2
    paths:
      - .github/workflows/apply-staging-calendar-id-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/booking-email-staging-recovered-2
          fetch-depth: 0
      - name: Pin exact IGS Calendar and fail closed
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps-script/IGS_Staging_CRM_V6_2_5_PRODUCTION_READINESS_R2.gs')
          source = path.read_text()

          config_before = "  CALENDAR_NAME: 'IGS Website Appointments',\n"
          config_after = (
              "  CALENDAR_NAME: 'IGS Website Appointments',\n"
              "  CALENDAR_ID: 'cbaff5b7abd586ce7e993fbd1809c7f99eda329da29d053af41192291f6f0bb2@group.calendar.google.com',\n"
          )
          if config_before not in source:
              raise SystemExit('Calendar config target not found')
          source = source.replace(config_before, config_after, 1)

          helper_before = """function ensureWebsiteCalendarV623_() {
            const calendars = CalendarApp.getCalendarsByName(CONFIG.CALENDAR_NAME);
            if (calendars.length) return calendars[0];

            return CalendarApp.createCalendar(CONFIG.CALENDAR_NAME, {
              description: 'Website consultation appointments from igsabroso.com',
              timeZone: CONFIG.TIMEZONE,
              hidden: false,
              selected: true,
            });
          }
          """
          helper_after = """function ensureWebsiteCalendarV623_() {
            const calendar = CalendarApp.getCalendarById(CONFIG.CALENDAR_ID);
            if (!calendar) {
              throw new Error(
                'IGS Website Appointments calendar is not accessible to this Apps Script execution account.'
              );
            }
            return calendar;
          }
          """
          if helper_before not in source:
              raise SystemExit('Calendar helper target not found')
          source = source.replace(helper_before, helper_after, 1)
          path.write_text(source)
      - name: Run Calendar and full unit tests
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test -- --run
      - name: Remove one-shot workflow
        run: rm -f .github/workflows/apply-staging-calendar-id-hardening.yml
      - name: Commit hardened source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(staging): pin booking lifecycle to dedicated Calendar ID"
          git push origin HEAD:feature/booking-email-staging-recovered-2
