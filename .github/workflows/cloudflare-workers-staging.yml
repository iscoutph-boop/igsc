name: IG Sabroso Cloudflare Release Verification

on:
  push:
    branches:
      - cloudflare-release
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Confirm Cloudflare-only deployment settings
        run: |
          test -f wrangler.jsonc
          grep -q '"name": "igsabroso-site"' wrangler.jsonc
          grep -q '@cloudflare/vite-plugin' vite.config.ts
          if grep -q '@netlify/vite-plugin-tanstack-start' vite.config.ts; then
            echo "::error::Netlify adapter must not be active."
            exit 1
          fi
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run unit and integration tests
        run: npm test -- --run
      - name: Build for Cloudflare Workers
        run: npm run build:workers
      - name: Verify deploy bundle without publishing
        run: npx wrangler deploy --dry-run
      - name: Inventory Cloudflare built files
        run: |
          echo "Build output directories:"
          find dist .output -maxdepth 4 -type f 2>/dev/null | head -n 30 || true
          echo "Build output totals:"
          du -sh dist .output 2>/dev/null || true
      - name: Preserve validated Cloudflare build as short-lived artifact
        uses: actions/upload-artifact@v4
        with:
          name: igsabroso-site-verified-worker-build
          path: |
            dist/
            .output/
            .wrangler/deploy/
          include-hidden-files: true
          retention-days: 2
          if-no-files-found: error
      - name: Publish verified IG Sabroso build if existing deployment credentials are available
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: cad0f4193e7115f79edbdd82f7365bcf
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "SKIPPED: No existing Cloudflare deployment secret is configured in this repository."
            exit 0
          fi
          echo "Existing Cloudflare CI authentication is configured. Deploying only igsabroso-site."
          npx wrangler deploy
