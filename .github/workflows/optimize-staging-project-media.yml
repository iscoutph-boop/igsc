name: Optimize staging project media

on:
  push:
    branches:
      - feature/booking-email-staging-recovered-2
    paths:
      - .github/workflows/optimize-staging-project-media.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: feature/booking-email-staging-recovered-2
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Optimize live project photography
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image, ImageOps
          import json

          root = Path('public/assets/projects')
          report = []
          before_total = 0
          after_total = 0
          max_edge = 2200

          for path in sorted(root.rglob('*')):
              if path.suffix.lower() not in {'.jpg', '.jpeg', '.png'}:
                  continue
              before = path.stat().st_size
              before_total += before
              changed = False

              if path.suffix.lower() in {'.jpg', '.jpeg'} and before > 450_000:
                  with Image.open(path) as raw:
                      image = ImageOps.exif_transpose(raw)
                      if image.mode not in ('RGB', 'L'):
                          image = image.convert('RGB')
                      if max(image.size) > max_edge:
                          image.thumbnail((max_edge, max_edge), Image.Resampling.LANCZOS)
                      if image.mode == 'L':
                          image = image.convert('RGB')
                      image.save(
                          path,
                          format='JPEG',
                          quality=85,
                          optimize=True,
                          progressive=True,
                          subsampling=2,
                      )
                  changed = True
              elif path.suffix.lower() == '.png' and before > 900_000:
                  with Image.open(path) as raw:
                      image = ImageOps.exif_transpose(raw)
                      if max(image.size) > max_edge:
                          image.thumbnail((max_edge, max_edge), Image.Resampling.LANCZOS)
                      image.save(path, format='PNG', optimize=True, compress_level=9)
                  changed = True

              after = path.stat().st_size
              after_total += after
              report.append({
                  'path': str(path),
                  'before': before,
                  'after': after,
                  'saved': before - after,
                  'changed': changed,
              })

          print(json.dumps(report, indent=2))
          print(f'PROJECT_MEDIA_BEFORE={before_total}')
          print(f'PROJECT_MEDIA_AFTER={after_total}')
          print(f'PROJECT_MEDIA_SAVED={before_total-after_total}')

          if after_total >= before_total:
              raise SystemExit('Optimization did not reduce the total project-media payload.')

          oversized_jpegs = [
              item for item in report
              if Path(item['path']).suffix.lower() in {'.jpg', '.jpeg'} and item['after'] > 1_200_000
          ]
          if oversized_jpegs:
              raise SystemExit('JPEGs still exceed 1.2 MB after optimization: ' + json.dumps(oversized_jpegs))

      - name: Remove one-shot workflow
        run: rm -f .github/workflows/optimize-staging-project-media.yml

      - name: Commit optimized staging media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "perf(staging): optimize project media payload"
          git push origin HEAD:feature/booking-email-staging-recovered-2
