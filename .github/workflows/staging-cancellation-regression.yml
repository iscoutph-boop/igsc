name: Staging Cancellation Regression

on:
  push:
    branches:
      - "staging/booking-crm-integration"

permissions:
  contents: read

jobs:
  cancellation-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run cancellation regression test
        run: npm test -- src/components/booking-modals.test.tsx
