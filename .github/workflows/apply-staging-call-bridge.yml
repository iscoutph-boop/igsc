name: Apply staging Call Client bridge

on:
  push:
    branches:
      - feature/booking-email-staging-recovered-2
    paths:
      - .github/workflows/apply-staging-call-bridge.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: feature/booking-email-staging-recovered-2
          fetch-depth: 0

      - name: Apply isolated Call Client patch
        run: node scripts/patch-v625-call-bridge.mjs

      - name: Remove one-shot patch machinery
        run: |
          rm -f scripts/patch-v625-call-bridge.mjs
          rm -f .github/workflows/apply-staging-call-bridge.yml

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(staging): harden Gmail mobile Call Client CTA"
          git push origin HEAD:feature/booking-email-staging-recovered-2
