name: Staging V6.3 Duplicate Guard

on:
  push:
    branches:
      - feature/booking-email-staging-recovered-2
    paths:
      - .github/workflows/staging-v63-duplicate-guard.yml

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install chromium
      - name: Verify recent duplicate is blocked
        env:
          QA_URL: https://deploy-preview-4--darling-sunburst-da0a5d.netlify.app/consultation
        run: |
          cat > .tmp-dup.mjs <<'EOF'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1100 } });
          async function directClick(locator) { await locator.evaluate(el => el.click()); }
          async function chooseDate(ymd) {
            const text = page.getByText('Pick a date', { exact: true });
            await directClick(text.locator('xpath=ancestor::button[1]'));
            const exact = page.locator(`button[data-day="${ymd}"]`);
            if (await exact.count()) { await directClick(exact.first()); return; }
            const day = Number(ymd.slice(-2));
            const candidates = page.locator('button').filter({ hasText: new RegExp(`^${day}$`) });
            for (let i = 0; i < await candidates.count(); i++) {
              const c = candidates.nth(i);
              if (await c.isVisible() && await c.isEnabled()) { await directClick(c); return; }
            }
            throw new Error(`Unable to choose date ${ymd}`);
          }
          async function chooseTime(label) {
            const text = page.getByText('Pick a time', { exact: true });
            await directClick(text.locator('xpath=ancestor::button[1]'));
            const option = page.getByRole('option', { name: label, exact: true });
            await option.waitFor({ state: 'visible', timeout: 10000 });
            await directClick(option);
          }
          try {
            await page.goto(process.env.QA_URL, { waitUntil: 'networkidle', timeout: 60000 });
            await page.getByLabel('Full name').fill('V63 QA 1788356120822');
            await page.getByLabel('Mobile number').fill('09171234567');
            await page.getByLabel('Email address').fill('caballerodigitals+v63qa1788356120822@gmail.com');
            await page.getByLabel('Project type').selectOption({ label: 'Residential' });
            await page.getByLabel('Preferred service').selectOption({ label: 'Project Consultation' });
            await page.getByLabel('Project location').fill('Cagayan de Oro');
            await page.getByLabel('Approximate lot or floor area').fill('150 sqm');
            await page.getByLabel('Budget range').selectOption({ label: 'PHP 3,000,000 - PHP 5,000,000' });
            await page.getByLabel(/Project description/).fill('V6.3 staging lifecycle QA 1788356120822');
            await chooseDate('2026-09-04');
            await chooseTime('9:00 AM');
            await page.getByRole('checkbox').check();
            await page.waitForTimeout(1700);
            await directClick(page.getByRole('button', { name: /submit consultation request/i }));
            const alert = page.getByRole('alert');
            await alert.waitFor({ timeout: 30000 });
            const message = await alert.innerText();
            if (!/matching request|received recently|wait before trying again/i.test(message)) throw new Error(`Duplicate guard did not block: ${message}`);
            await page.screenshot({ path: '/tmp/duplicate-guard-pass.png', fullPage: false });
            fs.writeFileSync('/tmp/duplicate-guard.json', JSON.stringify({ message }, null, 2));
            console.log(`DUPLICATE_GUARD_RESULT=${JSON.stringify({ message })}`);
          } finally {
            await browser.close();
            fs.rmSync('.tmp-dup.mjs', { force: true });
          }
          EOF
          node .tmp-dup.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v63-duplicate-guard
          path: |
            /tmp/duplicate-guard.json
            /tmp/duplicate-guard-pass.png
          if-no-files-found: warn
