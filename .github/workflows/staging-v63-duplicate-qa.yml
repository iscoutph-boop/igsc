name: Staging V6.3 Duplicate QA

on:
  push:
    branches:
      - feature/booking-email-staging-recovered-2
    paths:
      - .github/workflows/staging-v63-duplicate-qa.yml

permissions:
  contents: read

jobs:
  duplicate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify exact recent duplicate is blocked
        env:
          QA_URL: https://deploy-preview-4--darling-sunburst-da0a5d.netlify.app/consultation
          QA_EMAIL: caballerodigitals+v63qa1788356120822@gmail.com
        run: |
          cat > .tmp-dup.mjs <<'EOF'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1100}});
          const direct=async l=>l.evaluate(el=>el.click());
          async function chooseDate(ymd){
            await direct(page.getByText('Pick a date',{exact:true}).locator('xpath=ancestor::button[1]'));
            const exact=page.locator(`button[data-day="${ymd}"]`).first();
            if(await exact.count()){await direct(exact);return;}
            const d=String(Number(ymd.slice(-2))); const c=page.locator('button').filter({hasText:new RegExp(`^${d}$`)});
            for(let i=0;i<await c.count();i++){if(await c.nth(i).isVisible()&&await c.nth(i).isEnabled()){await direct(c.nth(i));return;}}
            throw new Error('Date unavailable');
          }
          async function chooseTime(label){
            await direct(page.getByText('Pick a time',{exact:true}).locator('xpath=ancestor::button[1]'));
            const o=page.getByRole('option',{name:label,exact:true}); await o.waitFor({state:'visible',timeout:10000}); await direct(o);
          }
          try{
            await page.goto(process.env.QA_URL,{waitUntil:'networkidle',timeout:60000});
            await page.getByLabel('Full name').fill('V63 QA 1788356120822');
            await page.getByLabel('Mobile number').fill('09171234567');
            await page.getByLabel('Email address').fill(process.env.QA_EMAIL);
            await page.getByLabel('Project type').selectOption({label:'Residential'});
            await page.getByLabel('Preferred service').selectOption({label:'Project Consultation'});
            await page.getByLabel('Project location').fill('Cagayan de Oro');
            await page.getByLabel('Approximate lot or floor area').fill('150 sqm');
            await page.getByLabel('Budget range').selectOption({label:'PHP 3,000,000 - PHP 5,000,000'});
            await page.getByLabel(/Project description/).fill('V6.3 staging lifecycle QA 1788356120822');
            await chooseDate('2026-09-04');
            await chooseTime('9:00 AM');
            await page.getByRole('checkbox').check();
            await page.waitForTimeout(1700);
            await direct(page.getByRole('button',{name:/submit consultation request/i}));
            const alert=page.getByRole('alert');
            const success=page.getByRole('heading',{name:/Consultation request received/i});
            const result=await Promise.race([
              alert.waitFor({timeout:30000}).then(()=>({kind:'blocked'})),
              success.waitFor({timeout:30000}).then(()=>({kind:'created'}))
            ]);
            if(result.kind==='blocked'){
              const message=await alert.innerText();
              if(!/matching request|received recently|wait before trying again/i.test(message)) throw new Error('Unexpected rejection: '+message);
              fs.writeFileSync('/tmp/duplicate.json',JSON.stringify({blocked:true,message},null,2));
              await page.screenshot({path:'/tmp/duplicate-blocked.png'});
              console.log('DUPLICATE_BLOCKED='+message);
            } else {
              const text=await page.locator('#consultation-confirmation').innerText();
              const ref=(text.match(/IGS-\d{4}-(?:[0-9A-F]{32}|\d{4})/i)||[])[0]||'';
              if(ref){
                await direct(page.locator('#consultation-confirmation').getByRole('button',{name:/manage booking/i}));
                await page.getByPlaceholder(/Enter your email or phone number/i).fill(process.env.QA_EMAIL);
                await direct(page.getByRole('button',{name:/find my booking/i}));
                await page.getByRole('heading',{name:/Appointment request found/i}).waitFor({timeout:30000});
                await direct(page.getByRole('button',{name:/cancel booking/i}));
                await page.getByLabel(/Cancellation reason/i).fill('Cleanup after duplicate QA');
                await direct(page.getByRole('button',{name:/yes, cancel booking/i}));
                await page.getByRole('heading',{name:/Booking cancelled/i}).waitFor({timeout:30000});
              }
              throw new Error('Duplicate request created booking '+ref+'; cleanup attempted');
            }
          }catch(e){fs.writeFileSync('/tmp/duplicate-failure.txt',String(e?.stack||e));throw e;}finally{await browser.close();fs.rmSync('.tmp-dup.mjs',{force:true});}
          EOF
          node .tmp-dup.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v63-duplicate-qa
          path: |
            /tmp/duplicate.json
            /tmp/duplicate-failure.txt
            /tmp/duplicate-blocked.png
          if-no-files-found: warn
