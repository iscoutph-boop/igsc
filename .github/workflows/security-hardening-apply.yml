name: Apply Form Abuse Hardening

on:
  push:
    branches:
      - feature/booking-email-staging-recovered-2
    paths:
      - .security-hardening-apply

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/booking-email-staging-recovered-2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply isolated Apps Script abuse hardening
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('apps-script/IGS_Staging_CRM_V6_2_5_PRODUCTION_READINESS_R2.gs')
          source = path.read_text(encoding='utf-8')

          config_anchor = """  APPOINTMENTS_HEADER_ROW: 8,\n};\n\nfunction doGet(e) {"""
          config_replacement = """  APPOINTMENTS_HEADER_ROW: 8,\n};\n\nconst ABUSE_SCREENING_V63_ = {\n  RECENT_DUPLICATE_TTL_SECONDS: 600,\n  SUSPICIOUS_SCORE: 3,\n  HIGH_CONFIDENCE_SCORE: 7,\n  SOLICITATION_PHRASES: [\n    'seo services',\n    'seo service',\n    'search engine optimization',\n    'backlink',\n    'link building',\n    'guest post',\n    'guest posting',\n    'rank your website',\n    'ranking on google',\n    'first page of google',\n    'lead generation',\n    'digital marketing services',\n    'website traffic',\n    'increase traffic',\n    'domain authority',\n    'crypto promotion',\n    'crypto investment',\n    'investment opportunity',\n    'forex trading',\n    'token presale',\n    'sponsored post',\n    'advertising opportunity',\n    'buy followers',\n    'social media marketing'\n  ],\n  SALES_TEMPLATE_PHRASES: [\n    'free website audit',\n    'free seo audit',\n    'guaranteed results',\n    'special offer',\n    'limited time offer',\n    'our agency',\n    'our team can help',\n    'marketing proposal',\n    'packages start',\n    'contact me on whatsapp',\n    'contact us on whatsapp',\n    'contact me on telegram',\n    'dear website owner',\n    'i came across your website',\n    'hope this message finds you well'\n  ],\n  SHORTENER_DOMAINS: [\n    'bit.ly',\n    'tinyurl.com',\n    't.co',\n    'rb.gy',\n    'cutt.ly',\n    'rebrand.ly',\n    'is.gd',\n    'shorturl.at',\n    'ow.ly'\n  ]\n};\n\nfunction doGet(e) {"""
          if source.count(config_anchor) != 1:
              raise SystemExit('Config insertion anchor changed; refusing unsafe patch.')
          source = source.replace(config_anchor, config_replacement, 1)

          validation_anchor = """  if (cleanTextV6_(payload.privacyConsent) !== 'accepted') {\n    throw new Error('Privacy consent is required.');\n  }\n\n  const preferredDate = parseBookingDateV6_(payload.preferredDate).normalized;"""
          validation_replacement = """  if (cleanTextV6_(payload.privacyConsent) !== 'accepted') {\n    throw new Error('Privacy consent is required.');\n  }\n  if (cleanTextV6_(payload.companyWebsite)) {\n    throw new Error('Unable to process this request. Please contact the team directly if you need assistance.');\n  }\n\n  const abuseAssessment = assessCreateBookingAbuseV63_(payload);\n  if (abuseAssessment.level === 'high') {\n    throw new Error('Unable to process this request. Please contact the team directly if you need assistance.');\n  }\n\n  const preferredDate = parseBookingDateV6_(payload.preferredDate).normalized;"""
          if source.count(validation_anchor) != 1:
              raise SystemExit('Validation insertion anchor changed; refusing unsafe patch.')
          source = source.replace(validation_anchor, validation_replacement, 1)

          duplicate_anchor = """    } else {\n      bookingReference = nextBookingReferenceV6_(bookingsSheet, new Date());"""
          duplicate_replacement = """    } else {\n      if (isRecentDuplicateSubmissionV63_(payload)) {\n        throw new Error('A matching request was received recently. Please wait before trying again.');\n      }\n      bookingReference = nextBookingReferenceV6_(bookingsSheet, new Date());"""
          if source.count(duplicate_anchor) != 1:
              raise SystemExit('Duplicate insertion anchor changed; refusing unsafe patch.')
          source = source.replace(duplicate_anchor, duplicate_replacement, 1)

          notes_anchor = """        notes: (submissionId ? submissionMarkerV625_(submissionId) + '\\n' : '') +\n          '[' + timestampV6_() + '] Website consultation request submitted.',\n      };\n      bookingRow = appendBookingRowV6_(bookingsSheet, booking);"""
          notes_replacement = """        notes: (submissionId ? submissionMarkerV625_(submissionId) + '\\n' : '') +\n          '[' + timestampV6_() + '] Website consultation request submitted.' +\n          (abuseAssessment.level === 'suspicious'\n            ? '\\n[' + timestampV6_() + '] Abuse screening: suspicious; manual review recommended.'\n            : ''),\n      };\n      bookingRow = appendBookingRowV6_(bookingsSheet, booking);\n      rememberRecentSubmissionV63_(payload);"""
          if source.count(notes_anchor) != 1:
              raise SystemExit('Booking note insertion anchor changed; refusing unsafe patch.')
          source = source.replace(notes_anchor, notes_replacement, 1)

          helper_anchor = """function normalizeDateOutputV6_(value) {"""
          helpers = r"""function assessCreateBookingAbuseV63_(payload) {
  const text = normalizeAbuseTextV63_([
    payload.fullName,
    payload.projectLocation,
    payload.preferredService,
    payload.projectDetails
  ].join(' '));
  const solicitationHits = countAbusePhraseHitsV63_(text, ABUSE_SCREENING_V63_.SOLICITATION_PHRASES);
  const templateHits = countAbusePhraseHitsV63_(text, ABUSE_SCREENING_V63_.SALES_TEMPLATE_PHRASES);
  const urlSignals = inspectSubmittedUrlsV63_(cleanTextV6_(payload.projectDetails));

  let score = Math.min(solicitationHits, 4) * 2 + Math.min(templateHits, 3);
  if (urlSignals.urlCount >= 2) score += 1;
  if (urlSignals.urlCount >= 4) score += 2;
  if (urlSignals.uniqueDomains >= 2) score += 1;
  if (urlSignals.uniqueDomains >= 3) score += 1;
  if (urlSignals.shortenerCount > 0) score += 2;

  let signalGroups = 0;
  if (solicitationHits > 0) signalGroups += 1;
  if (templateHits > 0) signalGroups += 1;
  if (urlSignals.urlCount >= 2 || urlSignals.shortenerCount > 0) signalGroups += 1;

  const highConfidence = score >= ABUSE_SCREENING_V63_.HIGH_CONFIDENCE_SCORE &&
    (signalGroups >= 2 || solicitationHits >= 3);
  return {
    level: highConfidence
      ? 'high'
      : (score >= ABUSE_SCREENING_V63_.SUSPICIOUS_SCORE ? 'suspicious' : 'low'),
    score: score,
    solicitationHits: solicitationHits,
    templateHits: templateHits,
    urlSignals: urlSignals
  };
}

function normalizeAbuseTextV63_(value) {
  return cleanTextV6_(value)
    .toLowerCase()
    .replace(/[-_]+/g, ' ')
    .replace(/\s+/g, ' ');
}

function countAbusePhraseHitsV63_(text, phrases) {
  let hits = 0;
  phrases.forEach(function (phrase) {
    if (text.indexOf(phrase) !== -1) hits += 1;
  });
  return hits;
}

function inspectSubmittedUrlsV63_(value) {
  const matches = cleanTextV6_(value).match(/\b(?:https?:\/\/|www\.)[^\s<>"']+/gi) || [];
  const domains = {};
  let shortenerCount = 0;

  matches.forEach(function (rawUrl) {
    const host = rawUrl
      .toLowerCase()
      .replace(/^https?:\/\//, '')
      .replace(/^www\./, '')
      .split(/[\/?#]/)[0]
      .replace(/:\d+$/, '');
    if (!host) return;
    domains[host] = true;
    if (ABUSE_SCREENING_V63_.SHORTENER_DOMAINS.indexOf(host) !== -1) {
      shortenerCount += 1;
    }
  });

  return {
    urlCount: matches.length,
    uniqueDomains: Object.keys(domains).length,
    shortenerCount: shortenerCount
  };
}

function submissionFingerprintV63_(payload) {
  const normalized = [
    payload.fullName,
    payload.phoneNumber,
    payload.emailAddress,
    payload.projectType,
    payload.projectLocation,
    payload.preferredService,
    payload.preferredDate,
    payload.preferredTime,
    payload.budgetRange,
    payload.projectDetails
  ].map(normalizeAbuseTextV63_).join('|');
  let hash = 5381;
  for (let index = 0; index < normalized.length; index += 1) {
    hash = ((hash * 33) ^ normalized.charCodeAt(index)) >>> 0;
  }
  return 'igs-create-v63-' + hash.toString(36);
}

function getAbuseCacheV63_() {
  try {
    if (typeof CacheService === 'undefined' || !CacheService.getScriptCache) return null;
    return CacheService.getScriptCache();
  } catch (_) {
    return null;
  }
}

function isRecentDuplicateSubmissionV63_(payload) {
  const cache = getAbuseCacheV63_();
  if (!cache) return false;
  try {
    return cache.get(submissionFingerprintV63_(payload)) === '1';
  } catch (_) {
    return false;
  }
}

function rememberRecentSubmissionV63_(payload) {
  const cache = getAbuseCacheV63_();
  if (!cache) return;
  try {
    cache.put(
      submissionFingerprintV63_(payload),
      '1',
      ABUSE_SCREENING_V63_.RECENT_DUPLICATE_TTL_SECONDS
    );
  } catch (_) {}
}

"""
          if source.count(helper_anchor) != 1:
              raise SystemExit('Helper insertion anchor changed; refusing unsafe patch.')
          source = source.replace(helper_anchor, helpers + helper_anchor, 1)

          path.write_text(source, encoding='utf-8')
          PY

          rm -f .security-hardening-apply
          git diff --check

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Targeted security tests
        run: >-
          npx vitest run
          apps-script/IGS_Staging_CRM_V6_2_5.abuse-hardening.test.ts
          apps-script/IGS_Staging_CRM_V6_2_5.test.ts
          src/lib/bookings.functions.test.ts
          src/security-config.test.ts

      - name: Production build regression gate
        run: npm run build

      - name: Commit isolated hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/IGS_Staging_CRM_V6_2_5_PRODUCTION_READINESS_R2.gs .security-hardening-apply
          git commit -m "feat(security): harden form abuse filtering"
          git push origin HEAD:feature/booking-email-staging-recovered-2
