name: Apply Form Abuse Hardening

on:
  push:
    branches:
      - feature/booking-email-staging-recovered-2
    paths:
      - .security-hardening-apply

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/booking-email-staging-recovered-2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply guarded security patch
        run: |
          python scripts/apply-abuse-hardening.py
          rm -f .security-hardening-apply
          git diff --check

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Targeted security tests
        run: >-
          npx vitest run
          apps-script/IGS_Staging_CRM_V6_2_5.abuse-hardening.test.ts
          apps-script/IGS_Staging_CRM_V6_2_5.test.ts
          src/lib/bookings.functions.test.ts
          src/security-config.test.ts

      - name: Production build regression gate
        run: npm run build

      - name: Commit isolated hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/IGS_Staging_CRM_V6_2_5_PRODUCTION_READINESS_R2.gs .security-hardening-apply
          git commit -m "feat(security): harden form abuse filtering"
          git push origin HEAD:feature/booking-email-staging-recovered-2
