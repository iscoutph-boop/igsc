name: Staging V6.3 Lifecycle QA v4

on:
  push:
    branches:
      - feature/booking-email-staging-recovered-2
    paths:
      - .github/workflows/staging-v63-lifecycle-qa-v4.yml

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Finish lifecycle and verify duplicate suppression
        env:
          QA_URL: https://deploy-preview-4--darling-sunburst-da0a5d.netlify.app/consultation
          QA_REF: IGS-2026-A7D99861E27940318D464492E244DBFE
          QA_EMAIL: caballerodigitals+v63qa1788356120822@gmail.com
        run: |
          cat > .tmp-v63-finish.mjs <<'EOF'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1100}});
          const ref=process.env.QA_REF;
          const email=process.env.QA_EMAIL;
          const problems=[];
          page.on('console',m=>{if(['error','warning'].includes(m.type()))problems.push(`${m.type()}: ${m.text()}`)});
          page.on('pageerror',e=>problems.push(`pageerror: ${e.message}`));
          const direct=async l=>l.evaluate(el=>el.click());
          async function openManage(){
            const buttons=page.getByRole('button',{name:/manage booking/i});
            await direct(buttons.first());
            await page.getByPlaceholder(/Example: IGS-/i).fill(ref);
            await page.getByPlaceholder(/Enter your email or phone number/i).fill(email);
            await direct(page.getByRole('button',{name:/find my booking/i}));
            await page.getByRole('heading',{name:/Appointment request found/i}).waitFor({timeout:30000});
          }
          async function chooseDate(ymd){
            const b=page.getByText('Pick a date',{exact:true}).locator('xpath=ancestor::button[1]');
            await direct(b);
            const exact=page.locator(`button[data-day="${ymd}"]`).first();
            if(await exact.count()){await direct(exact);return;}
            const day=String(Number(ymd.slice(-2)));
            const c=page.locator('button').filter({hasText:new RegExp(`^${day}$`)});
            for(let i=0;i<await c.count();i++){if(await c.nth(i).isVisible()&&await c.nth(i).isEnabled()){await direct(c.nth(i));return;}}
            throw new Error('date unavailable '+ymd);
          }
          async function chooseTime(label){
            const b=page.getByText('Pick a time',{exact:true}).locator('xpath=ancestor::button[1]');
            await direct(b);
            const o=page.getByRole('option',{name:label,exact:true});
            await o.waitFor({state:'visible',timeout:10000});
            await direct(o);
          }
          async function fillOriginal(){
            await page.getByLabel('Full name').fill('V63 QA 1788356120822');
            await page.getByLabel('Mobile number').fill('09171234567');
            await page.getByLabel('Email address').fill(email);
            await page.getByLabel('Project type').selectOption({label:'Residential'});
            await page.getByLabel('Preferred service').selectOption({label:'Project Consultation'});
            await page.getByLabel('Project location').fill('Cagayan de Oro');
            await page.getByLabel('Approximate lot or floor area').fill('150 sqm');
            await page.getByLabel('Budget range').selectOption({label:'PHP 3,000,000 - PHP 5,000,000'});
            await page.getByLabel(/Project description/).fill('V6.3 staging lifecycle QA 1788356120822');
            await chooseDate('2026-09-04');
            await chooseTime('9:00 AM');
            await page.getByRole('checkbox').check();
            await page.waitForTimeout(1700);
          }
          async function cancelCurrent(reason){
            await direct(page.getByRole('button',{name:/cancel booking/i}));
            await page.getByLabel(/Cancellation reason/i).fill(reason);
            await direct(page.getByRole('button',{name:/yes, cancel booking/i}));
            await page.getByRole('heading',{name:/Booking cancelled/i}).waitFor({timeout:30000});
          }
          try{
            await page.goto(process.env.QA_URL,{waitUntil:'networkidle',timeout:60000});
            await openManage();
            if(!/Rescheduled/i.test(await page.locator('body').innerText())) throw new Error('Expected Rescheduled before cancel');
            await cancelCurrent('Automated V6.3 staging cancellation QA');
            await page.screenshot({path:'/tmp/03-cancelled.png'});
            await direct(page.getByRole('button',{name:/^Done$/i}));
            await openManage();
            if(!/Cancelled/i.test(await page.locator('body').innerText())) throw new Error('Cancelled status not persisted');
            await page.screenshot({path:'/tmp/04-find-cancelled.png'});
            await direct(page.getByLabel('Close manage booking'));

            await fillOriginal();
            await direct(page.getByRole('button',{name:/submit consultation request/i}));
            const alert=page.getByRole('alert');
            const success=page.getByRole('heading',{name:/Consultation request received/i});
            const outcome=await Promise.race([
              alert.waitFor({timeout:30000}).then(()=>({kind:'blocked',message:null})),
              success.waitFor({timeout:30000}).then(()=>({kind:'created',message:null}))
            ]);
            let duplicateMessage='';
            let duplicateRef='';
            if(outcome.kind==='blocked'){
              duplicateMessage=await alert.innerText();
              if(!/matching request|received recently|wait before trying again/i.test(duplicateMessage)) throw new Error('Unexpected duplicate rejection: '+duplicateMessage);
              await page.screenshot({path:'/tmp/05-duplicate-blocked.png'});
            }else{
              const txt=await page.locator('#consultation-confirmation').innerText();
              duplicateRef=(txt.match(/IGS-\d{4}-(?:[0-9A-F]{32}|\d{4})/i)||[])[0]||'';
              if(duplicateRef){
                await direct(page.locator('#consultation-confirmation').getByRole('button',{name:/manage booking/i}));
                await page.getByPlaceholder(/Enter your email or phone number/i).fill(email);
                await direct(page.getByRole('button',{name:/find my booking/i}));
                await page.getByRole('heading',{name:/Appointment request found/i}).waitFor({timeout:30000});
                await cancelCurrent('Cleanup after failed duplicate-suppression QA');
              }
              throw new Error('Duplicate suppression did not block; cleanup attempted for '+duplicateRef);
            }
            const report={ref,email,duplicateMessage,problems};
            fs.writeFileSync('/tmp/v63-finish.json',JSON.stringify(report,null,2));
            console.log('QA_FINISH='+JSON.stringify(report));
          }catch(e){
            await page.screenshot({path:'/tmp/99-failure.png',fullPage:true}).catch(()=>{});
            fs.writeFileSync('/tmp/v63-finish-failure.txt',String(e?.stack||e));
            throw e;
          }finally{await browser.close();fs.rmSync('.tmp-v63-finish.mjs',{force:true});}
          EOF
          node .tmp-v63-finish.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v63-staging-lifecycle-qa-v4
          path: |
            /tmp/v63-finish.json
            /tmp/v63-finish-failure.txt
            /tmp/03-cancelled.png
            /tmp/04-find-cancelled.png
            /tmp/05-duplicate-blocked.png
            /tmp/99-failure.png
          if-no-files-found: warn
