name: Diagnose V6.3 Build

on:
  push:
    branches:
      - feature/booking-email-staging-recovered-2
    paths:
      - ".github/workflows/diagnose-v63-build.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/booking-email-staging-recovered-2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Clean install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Capture build output
        shell: bash
        run: |
          set +e
          npm run build > docs/v63-build-diagnostic.txt 2>&1
          status=$?
          printf '\nBUILD_EXIT_CODE=%s\n' "$status" >> docs/v63-build-diagnostic.txt
          exit 0
      - name: Commit diagnostic log
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/v63-build-diagnostic.txt
          if git diff --cached --quiet; then
            echo "No diagnostic changes."
            exit 0
          fi
          git commit -m "chore: record V6.3 build diagnostic"
          git pull --rebase origin feature/booking-email-staging-recovered-2
          git push origin HEAD:feature/booking-email-staging-recovered-2
