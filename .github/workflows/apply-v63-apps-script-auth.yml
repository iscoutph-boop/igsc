name: Apply V6.3 Apps Script Auth Patch

on:
  push:
    branches:
      - feature/booking-email-staging-recovered-2
    paths:
      - .github/workflows/apply-v63-apps-script-auth.yml
      - scripts/apply-v63-apps-script-auth.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/booking-email-staging-recovered-2
      - name: Apply deterministic Apps Script security patch
        run: python scripts/apply-v63-apps-script-auth.py
      - name: Commit patched Apps Script source
        run: |
          if git diff --quiet -- apps-script/IGS_Staging_CRM_V6_2_5_PRODUCTION_READINESS_R2.gs; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/IGS_Staging_CRM_V6_2_5_PRODUCTION_READINESS_R2.gs
          git commit -m "feat: authenticate Apps Script booking requests"
          git push origin HEAD:feature/booking-email-staging-recovered-2
